[toolchain]

[features]
seeds = false
skip-lint = false

[workspace]
members = ["programs/merkle-claim"]

[programs.devnet]
merkle_claim = "CLAiM1111111111111111111111111111111111111"

[programs.mainnet]
merkle_claim = "CLAiM1111111111111111111111111111111111111"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "${HOME}/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
